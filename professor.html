          <span class="topbar-school">Colégio Barbosa Ferraz</span>

      <nav class="topbar-nav">

          <input class="search-input" id="searchAlunos" type="text" placeholder="Buscar aluno...">
          <button class="btn-gold-outline" id="addAlunoBtn">+ Novo aluno</button>
        </div>
      </div>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Atividade recente</h2>
      </div>
      <div
