<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New-Bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="splash-body">

  <main class="stage">
    <div class="frame">

      <div class="crest-wrap" id="crestWrap">

      <img
        src="img/logo-newbit.png"
        alt="Logo New-Bit"
        class="crest-logo"
     >

      </div>

      <p class="eyebrow">bem-vindo ao</p>
      <h1 class="wordmark">New&#8209;Bit</h1>
      <p class="tagline">Sua PRESENÇA vale Moedas</p>

      <button class="btn-primary" id="enterBtn">Entrar</button>

      <nav class="dock" aria-label="Atalhos">
        <button class="dock-item" data-target="carteira" disabled>
          <svg viewBox="0 0 24 24" class="dock-icon"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1h-9a3 3 0 0 0-3 3v4a3 3 0 0 0 3 3h9v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M14 10h5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z"/><circle cx="16.5" cy="14" r="1"/></svg>
          <span>Carteira</span>
        </button>
        <button class="dock-item" data-target="loja" disabled>
          <svg viewBox="0 0 24 24" class="dock-icon"><path d="M4 8l1.5-4h13L20 8"/><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8z"/><path d="M9 12a3 3 0 0 0 6 0"/></svg>
          <span>Loja</span>
        </button>
        <button class="dock-item" data-target="carrinho" disabled>
          <svg viewBox="0 0 24 24" class="dock-icon"><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/></svg>
          <span>Carrinho</span>
        </button>
      </nav>
      <p class="dock-hint">faça login para acessar sua carteira</p>

    </div>
  </main>
<script	src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
