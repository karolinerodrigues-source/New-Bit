<!DOCTYPE	html>
<html	lang="pt-BR">
<head>
<meta	charset="UTF-8">
<meta	name="viewport"	content="width=device-width,	initial-scale=1.0">
<title>Entrar	·	New-Bit</title>
<link	rel="preconnect"	href="https://fonts.googleapis.com">
<link	rel="preconnect"	href="https://fonts.gstatic.com"	crossorigin>
<link	href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"	rel="stylesheet">
<link	rel="stylesheet"	href="css/style.css">
</head>
<body	class="login-body">
		<main	class="stage">
				<div	class="frame	frame-login">
						<a	href="index.html"	class="back-link"	aria-label="Voltar">
								<svg	viewBox="0	0	24	24"	class="back-icon"><path	d="M15	6l-6	6	6	6"/></svg>
						</a>
						<div	class="login-head">
								<span	class="login-eyebrow">New&#8209;Bit</span>
								<h1	class="login-title">Entrar</h1>
						</div>
						<div	class="role-tabs"	role="tablist"	aria-label="Tipo	de	perfil">
								<button	class="role-tab	is-active"	role="tab"	aria-selected="true"	data-role="aluno">Aluno</button>
								<button	class="role-tab"	role="tab"	aria-selected="false"	data-role="professor">Professor</button>
								<button	class="role-tab"	role="tab"	aria-selected="false"	data-role="admin">Administrador</button>
						</div>
						<form	class="login-form"	id="loginForm"	novalidate>
								<label	class="field">
										<span	class="field-label"	data-label-for="email">E-mail	institucional</span>
										<input	class="field-input"	type="email"	name="email"	id="email"
																	placeholder="nome.sobrenome@escola.pr.gov.br"	autocomplete="username"	required>
								</label>
								<label	class="field">
										<span	class="field-label">Senha</span>
										<div	class="field-pw">
												<input	class="field-input"	type="password"	name="senha"	id="senha"
																			placeholder="••••••••"	autocomplete="current-password"	required>
												<button	type="button"	class="pw-toggle"	id="pwToggle"	aria-label="Mostrar	senha">
														<svg	viewBox="0	0	24	24"	class="pw-icon"><path	d="M1	12s4-7	11-7	11	7	11	7-4	7-11	7-11-7-11-7z"/><circle	cx="12"	cy="12"	r="3"/></svg>
												</button>
										</div>
								</label>
								<div	class="student-only"	id="cardHint">
										<svg	viewBox="0	0	24	24"	class="hint-icon"><rect	x="3"	y="6"	width="18"	height="12"	rx="2"/><path	d="M7	9h4v4H7z"/><path	d="M14	10h3M14	13h3"/></svg>
										<span>Prefere	ler	seu	cartão?	Use	o	tablet	do	pátio	no	acolhimento.</span>
								</div>
								<p	class="form-error"	id="formError"	hidden>Preencha	e-mail	e	senha	para	continuar.</p>
								<button	type="submit"	class="btn-primary	btn-block">Acessar</button>
						</form>
						<p	class="admin-note"	id="adminNote"	hidden>Novos	perfis	de	administrador	exigem	aprovação	e	aceite	dos	termos	de	tratamento	de	dados	(LGPD).</p>
				</div>
		</main>
<script	src="js/store.js"></script>
<script	src="js/app.js"></script>
</body>
</html>
